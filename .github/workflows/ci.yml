name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alertlens
          POSTGRES_PASSWORD: alertlens
          POSTGRES_DB: alertlens
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check api scripts tests benchmark.py
      - run: python scripts/generate_synthetic.py
      - run: python scripts/train.py
      - run: python -m pytest tests/ -q --cov=api --cov-report=xml --cov-fail-under=90
        env:
          DATABASE_URL: postgresql+psycopg2://alertlens:alertlens@localhost:5432/alertlens
          API_KEY: test-key
      - run: python benchmark.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # CI-only test key (clearly fake; never a real secret). Compose
      # requires API_KEY with no fallback, so the workflow sets it here
      # and writes it to .env for `docker compose`.
      API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - run: printf 'API_KEY=%s\nSEED_DEMO=false\n' "$API_KEY" > .env
      - run: docker compose up -d --build --wait
      - run: python scripts/docker_smoke.py
      - run: docker compose down -v
        if: always()
