
name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alertlens
          POSTGRES_PASSWORD: alertlens
          POSTGRES_DB: alertlens
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt

      - run: ruff check api scripts tests benchmark.py

      - run: python scripts/generate_synthetic.py

      - run: python scripts/train.py

      - run: python -m pytest tests/ -q --cov=api --cov-report=xml --cov-fail-under=90
        env:
          DATABASE_URL: postgresql+psycopg2://alertlens:alertlens@localhost:5432/alertlens
          API_KEY: test-key

      - run: python benchmark.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      # Python is needed by the host-side smoke-test helper.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # load_csv.py imports httpx when docker_smoke.py invokes it.
      - run: python -m pip install httpx==0.28.1

      # Create the CI-only environment file.
      - run: printf 'API_KEY=%s\nSEED_DEMO=false\n' "$API_KEY" > .env

      # Build and start PostgreSQL, API and frontend.
      - run: docker compose up -d --build --wait

      # Verify authentication, proxy, ingestion and metrics.
      - run: python scripts/docker_smoke.py

      # Always clean up containers and volumes.
      - run: docker compose down -v
        if: always()
